<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rodillator - demo Scene3D (no se publica)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1014; color: #fff; font: 14px Inter, Arial, sans-serif; }
  #view { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 10px; background: rgba(12,14,18,.7); padding: 6px 10px; border-radius: 6px; }
</style>
<script>
  // three.js: CDN por defecto; ?three=<url> permite una copia local (solo para esta demo).
  (function () {
    var q = new URLSearchParams(location.search);
    var src = q.get('three') || 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
    document.write('<script src="' + src + '"><\/script>');
  })();
</script>
<script src="../src/scene3d.js"></script>
</head>
<body>
<div id="view"></div>
<div id="hud">Rodillator Scene3D | teclas 1 persecucion, 2 aerea, 3 lateral</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);

  // ---- terreno sintetico 64x64 (heights base64 Uint16 LE, fila 0 = norte) ----
  var BBOX = [-70.95, -33.64, -70.89, -33.58];            // minLon, minLat, maxLon, maxLat
  var MIN_E = 500, MAX_E = 1500, N = 64;
  function hfun(u, v) {                                    // u: oeste->este, v: norte->sur (0..1)
    return 0.45 + 0.28 * Math.sin(u * 5.1 + 0.6) * Math.cos(v * 4.3) + 0.14 * Math.sin(u * 13 + v * 9) + 0.25 * (1 - v) * u;
  }
  function ele(u, v) { var h = Math.min(1, Math.max(0, hfun(u, v))); return MIN_E + h * (MAX_E - MIN_E); }

  var bytes = new Uint8Array(N * N * 2), r, c;
  for (r = 0; r < N; r++) for (c = 0; c < N; c++) {
    var val = Math.round((ele(c / (N - 1), r / (N - 1)) - MIN_E) / (MAX_E - MIN_E) * 65535);
    bytes[(r * N + c) * 2] = val & 255; bytes[(r * N + c) * 2 + 1] = val >> 8;
  }
  var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);

  // ---- textura generada en canvas (verde/tierra por altura + ruido) ----
  var tc = document.createElement('canvas'); tc.width = tc.height = 512;
  var tx = tc.getContext('2d'), id = tx.createImageData(512, 512);
  for (r = 0; r < 512; r++) for (c = 0; c < 512; c++) {
    var h = (ele(c / 511, r / 511) - MIN_E) / (MAX_E - MIN_E), n = Math.random() * 0.14 - 0.07;
    var o = (r * 512 + c) * 4, g = Math.sin(c * 0.09) * Math.sin(r * 0.07) * 0.06;
    id.data[o] = 255 * Math.min(1, 0.22 + h * 0.55 + n + g); id.data[o + 1] = 255 * Math.min(1, 0.42 + h * 0.2 + n);
    id.data[o + 2] = 255 * Math.min(1, 0.18 + h * 0.15 + n); id.data[o + 3] = 255;
  }
  tx.putImageData(id, 0, 0);

  // ---- ruta sintetica serpenteante ----
  var pts = [], dist = 0, prev = null, M = 700;
  for (i = 0; i < M; i++) {
    var t = i / (M - 1);
    var u = 0.10 + 0.80 * t + 0.045 * Math.sin(t * 15), v = 0.82 - 0.62 * t + 0.07 * Math.cos(t * 11);
    var lon = BBOX[0] + u * (BBOX[2] - BBOX[0]), lat = BBOX[3] - v * (BBOX[3] - BBOX[1]);
    if (prev) {
      var dx = (lon - prev[1]) * 111195 * Math.cos(lat * Math.PI / 180), dy = (lat - prev[0]) * 111195;
      dist += Math.sqrt(dx * dx + dy * dy);
    }
    pts.push([lat, lon, ele(u, v), dist]); prev = pts[pts.length - 1];
  }
  var route = {
    id: 'demo', name: 'Demo sintetica', distanceM: dist, points: pts, synthetic: true,
    terrain: { bbox: BBOX, width: N, height: N, minEle: MIN_E, maxEle: MAX_E, heights: btoa(bin), texture: q.get('notex') ? null : tc.toDataURL('image/jpeg', 0.85), attribution: 'sintetico' }
  };
  if (q.get('noterrain')) route.terrain = null;

  // ---- escena y bucle ----
  var scene = R.Scene3D.create(document.getElementById('view'), route, { quality: q.get('quality') || 'auto' });
  scene.setCameraMode(q.get('cam') || 'persecucion');
  addEventListener('keydown', function (e) {
    var m = { '1': 'persecucion', '2': 'aerea', '3': 'lateral' }[e.key]; if (m) scene.setCameraMode(m);
  });

  var riders = [
    { id: 'u', name: 'Tu', kind: 'user', distM: 300, label: 'TU', color: '#FF5A1F', v: 9 },
    { id: 'g', name: 'Mejor marca', kind: 'ghost', distM: 322, label: 'MEJOR MARCA', color: '#FFD23F', v: 8.8 },
    { id: 'b1', name: 'Camila', kind: 'bot', distM: 322, label: 'Camila', color: '#7FA7C9', v: 8.8 },
    { id: 'b2', name: 'Diego', kind: 'bot', distM: 300, label: 'Diego', color: '#7FA7C9', v: 9 },
    { id: 'b3', name: 'Javiera', kind: 'bot', distM: 380, label: 'Javiera', color: '#7FA7C9', v: 9.6 },
    { id: 'b4', name: 'Matias', kind: 'bot', distM: 480, label: 'Matias', color: '#7FA7C9', v: 7.4 },
    { id: 'b5', name: 'Fernanda', kind: 'bot', distM: 250, label: 'Fernanda', color: '#7FA7C9', v: 8.2 }
  ];
  var last = performance.now(), frames = 0, acc = 0, hud = document.getElementById('hud');
  function tick(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    for (var k = 0; k < riders.length; k++) { riders[k].distM += riders[k].v * dt; if (riders[k].distM > dist - 30) riders[k].distM = 30; }
    scene.setRiders(riders);
    scene.render(dt);
    frames++; acc += dt;
    if (acc > 1) { hud.textContent = 'Rodillator Scene3D | ' + Math.round(frames / acc) + ' fps | teclas 1/2/3 camara'; frames = 0; acc = 0; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__scene = scene;
})();
</script>
</body>
</html>
